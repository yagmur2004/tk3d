name: Auto Sync tk3D Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and Merge from Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/EsatSimsek/tk3D.git
          git fetch upstream master
          
          git checkout main
          git merge upstream/master -m "chore: auto-sync from upstream" --allow-unrelated-histories || exit 0
          git push origin main
