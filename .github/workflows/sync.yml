name: Auto Sync tk3D Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and Merge from Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Upstream remote ekle
          git remote add upstream https://github.com/EsatSimsek/tk3D.git || true
          git fetch upstream
          
          # Mevcut aktif branch'i al
          CURRENT_BRANCH=$(git branch --show-current)
          
          # Upstream'den değişiklikleri merge et (hata alsa bile süreci kırma)
          git merge upstream/$CURRENT_BRANCH -m "chore: auto-sync from upstream" --allow-unrelated-histories || true
          
          # Güncellemeleri push et
          git push origin $CURRENT_BRANCH
